<div class="d-flex justify-content-between mb-2">
	<div>
		<button class="btn btn-outline-dark bi bi-plus" (click)="OpenCreateTeamModal()"></button>&nbsp;
	</div>
	<div class="d-flex justify-content-end">
		<div class="me-2">
			<input type="text" placeholder="search" class="btn btn-outline-dark" id="search">
		</div>
		<div>
			<button class="btn btn-outline-dark bi bi-search" (click)="SendSearchParameter()"></button>
		</div>
	</div>

</div>
<div class="pb-3">
    <alert-component />
	<div class="globalborders">
    	<table class="w-100">
    	    <thead>
    	    <tr>
    	        <th class="ps-2">Client Name</th>
    	        <th class="ps-2">Team Name</th>
    	        <th class="ps-2">Create Date</th>
    	        <th class="ps-2">Update Date</th>
				<th class="ps-2"></th>
    	    </tr>

    	    </thead>
    	    <tbody class="table-group-divider">
    	        @for (item of this.itemList; track item) {
    	            <tr>
    	                <td class="ps-2">
    	                    {{item.clientname}}
    	                </td>
    	                <td class="ps-2">
    	                    {{item.name}}
    	                </td>
    	                <td class="ps-2 options">
    	                    {{item.createdate | date : 'dd.MM.yyyy HH:mm:ss'}}
    	                </td>
    	                <td class="ps-2 options">
    	                    {{item.updatedate | date : 'dd.MM.yyyy HH:mm:ss'}}
    	                </td>
    	                <td class="ps-2 options">
    	                    <button class="btn btn-outline-dark bi-trash" (click)="OpenDeleteModal(item)"></button>&nbsp;
    	                    <button class="btn btn-outline-dark bi bi-pencil" (click)="OpenUpdateTeamModal(item)"></button>&nbsp;
							<button class="btn btn-outline-dark bi bi-people" (click)="OpenMembershipModal(item.id)"></button>
    	                </td>
    	            </tr>
    	        }
    	    </tbody>

    	</table>
	</div>

</div>
