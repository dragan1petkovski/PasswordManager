<div class="modal-header">
    <h5 class="modal-title">{{ type }} Client</h5>
</div>
<div class="modal-body">
    <form [formGroup]="createClient">
        <div class="d-flex justify-content-center">
          <div class="flex-shirink-0 me-2">
            <p>Client Name@if (this.createClient.controls.name.invalid) {
              <span class="text-danger">*</span>
            } </p>
          </div>
          <div class="col-6">
            <input type="text" class="form-control" formControlName="name" >
          </div>
        </div>
        <div class="d-flex justify-content-center">
          @if(this.createClient.controls.name.invalid)
            {
            @if(this.createClient.controls.name.dirty || this.createClient.controls.name.touched)
              {
              <p class="text-danger">Invalid Username</p>
            }
          }
        </div>
    </form>
</div>
<div class="modal-footer">
    @if(type === "Create")
    {
        <button class="btn btn-danger" (click)="CreateClient()" [disabled]="this.createClient.invalid">{{type}} Client</button>
    }
    @else if(type === "Update")
    {
        <button class="btn btn-danger" (click)="UpdateClient(_updateClient)" [disabled]="this.createClient.invalid">{{ type }} Client</button>
    }
    <button class="btn btn-secondary" (click)="activeModal.close()">Close</button>
</div>
