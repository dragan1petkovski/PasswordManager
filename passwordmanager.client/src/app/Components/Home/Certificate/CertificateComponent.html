<div class="d-flex justify-content-between mb-2">
    <div>
        <button class="btn btn-outline-dark bi bi-plus me-2" (click)="OpenCertificateModal()"></button>
    </div>
    <div class="d-flex justify-content-end">
        <div class="me-2">
            <input type="text" placeholder="search" class="btn btn-outline-dark" id="search">
        </div>
        <div>
            <button class="btn btn-outline-dark bi bi-search" (click)="SendSearchParameter()"></button>
        </div>
    </div>
</div>

<div>

        <table class="w-100">

                <th>Friendly Name</th>

                <th class="options">Valid From</th>
                <th class="options">Valid Till</th>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
